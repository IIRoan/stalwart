name: Mirror VPS secret to rocal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: mail-vps
    steps:
      - name: Mirror secrets to IIRoan/rocal mail-vps
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          ADMIN_ALLOW_IP: ${{ secrets.ADMIN_ALLOW_IP }}
          STALWART_DATABASE_URL: ${{ secrets.STALWART_DATABASE_URL }}
          GH_TOKEN: ${{ secrets.MIRROR_GH_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?}"
          : "${VPS_SSH_PRIVATE_KEY:?}"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | gh secret set VPS_SSH_PRIVATE_KEY -R IIRoan/rocal --env mail-vps
          if [ -n "${ADMIN_ALLOW_IP:-}" ]; then
            printf '%s\n' "$ADMIN_ALLOW_IP" | gh secret set ADMIN_ALLOW_IP -R IIRoan/rocal --env mail-vps
          fi
          if [ -n "${STALWART_DATABASE_URL:-}" ]; then
            printf '%s\n' "$STALWART_DATABASE_URL" | gh secret set STALWART_DATABASE_URL -R IIRoan/rocal --env mail-vps
          fi
          gh secret set VPS_SSH_USER -R IIRoan/rocal --env mail-vps -b 'gh-cert-sync'
          gh secret set VPS_SSH_HOST -R IIRoan/rocal --env mail-vps -b 'mail.solace.onl'
          echo "Mirrored VPS secrets to IIRoan/rocal mail-vps"
