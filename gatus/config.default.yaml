storage:
  type: sqlite
  path: /data/gatus.db
  maximum-number-of-results: 100

web:
  address: 0.0.0.0
  port: ${PORT}

metrics: true

ui:
  title: "Solace Status"
  header: "Solace"
  description: "Uptime for Solace (solace.onl) and mail (mail.solace.onl)."
  dashboard-heading: "Service Health"
  dashboard-subheading: "Three-month uptime for Solace and mail infrastructure."
  logo: /solace-logo.png
  link: "https://solace.onl"
  dark-mode: false
  default-sort-by: group
  favicon:
    default: /favicon.ico
    size16x16: /favicon-16x16.png
    size32x32: /favicon-32x32.png
  buttons:
    - name: "Open Solace"
      link: "https://solace.onl"
  custom-css: |
    /* Solace palette — Gatus expects HSL triplets: hsl(var(--token)) */
    :root {
      --background: 40 8% 98%;
      --foreground: 30 6% 18%;
      --card: 40 10% 99%;
      --card-foreground: 30 6% 18%;
      --popover: 40 10% 99%;
      --popover-foreground: 30 6% 18%;
      --primary: 35 12% 36%;
      --primary-foreground: 0 0% 100%;
      --secondary: 74 18% 88%;
      --secondary-foreground: 41 14% 28%;
      --muted: 40 6% 95%;
      --muted-foreground: 30 3% 42%;
      --accent: 40 8% 93%;
      --accent-foreground: 30 6% 18%;
      --destructive: 17 63% 53%;
      --destructive-foreground: 0 0% 100%;
      --border: 35 6% 86%;
      --input: 35 5% 88%;
      --ring: 35 12% 36%;
      --radius: 0.5rem;
      --solace-success: 150 32% 42%;
      --solace-success-strong: 150 36% 34%;
      --solace-danger: 17 63% 53%;
      --solace-danger-strong: 17 68% 44%;
    }

    :root.dark {
      --background: 0 0% 11%;
      --foreground: 40 6% 94%;
      --card: 0 0% 14%;
      --card-foreground: 40 6% 94%;
      --popover: 0 0% 14%;
      --popover-foreground: 40 6% 94%;
      --primary: 66 48% 78%;
      --primary-foreground: 200 12% 12%;
      --secondary: 63 12% 24%;
      --secondary-foreground: 66 48% 78%;
      --muted: 0 0% 18%;
      --muted-foreground: 0 0% 68%;
      --accent: 0 0% 20%;
      --accent-foreground: 40 6% 94%;
      --destructive: 17 63% 53%;
      --destructive-foreground: 0 0% 100%;
      --border: 50 4% 24%;
      --input: 0 0% 28%;
      --ring: 66 48% 78%;
      --solace-success: 150 38% 52%;
      --solace-success-strong: 150 42% 44%;
      --solace-danger: 17 63% 58%;
      --solace-danger-strong: 17 68% 48%;
    }

    #global {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    header .container {
      max-width: 80rem;
    }

    .dashboard-container .container {
      max-width: 80rem;
    }

    header h1 {
      color: hsl(var(--primary));
    }

    header img {
      border-radius: 9999px;
    }

    /* Status bars — Solace success / destructive */
    .text-green-500,
    .text-green-400,
    .text-green-700 {
      color: hsl(var(--solace-success)) !important;
    }

    .bg-green-500 {
      background-color: hsl(var(--solace-success)) !important;
    }

    .bg-green-700,
    .hover\:bg-green-700:hover {
      background-color: hsl(var(--solace-success-strong)) !important;
    }

    .text-red-500,
    .text-red-700 {
      color: hsl(var(--solace-danger)) !important;
    }

    .bg-red-500 {
      background-color: hsl(var(--solace-danger)) !important;
    }

    .bg-red-700,
    .hover\:bg-red-700:hover {
      background-color: hsl(var(--solace-danger-strong)) !important;
    }

    .dark .bg-gray-200,
    .dark .bg-gray-700 {
      background-color: hsl(var(--muted)) !important;
    }

.endpoint-ui: &endpoint-ui
  period: 90d

# Shared Prometheus scrape target (auth injected at boot).
# Scraped via slot-manager so HAProxy never round-robins to the warming slot during cutover.
.prometheus: &prometheus
  url: https://mail.solace.onl/slot-manager/metrics/prometheus
  headers:
    Authorization: "Basic __PROMETHEUS_BASIC_AUTH__"
  client:
    timeout: 15s
  ui:
    <<: *endpoint-ui
    hide-url: true

endpoints:
  - name: website
    group: Application
    url: https://solace.onl/
    interval: 60s
    ui:
      <<: *endpoint-ui
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: api-health
    group: Application
    url: https://api.solace.onl/api/health
    interval: 60s
    ui:
      <<: *endpoint-ui
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: jmap-session
    group: Mail
    url: https://mail.solace.onl/jmap/session
    interval: 30s
    ui:
      <<: *endpoint-ui
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: slot-blue-green
    group: Mail
    url: https://mail.solace.onl/slot-manager/status
    interval: 60s
    ui:
      <<: *endpoint-ui
    headers:
      Authorization: "Bearer ${SLOT_MANAGER_TOKEN}"
    conditions:
      - "[STATUS] == 200"

  - name: stalwart-exporter
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP server_memory*)"
      - "[BODY] == pat(*# TYPE server_memory*)"

  - name: stalwart-smtp-receive
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP smtp_active_connections*)"
      - "[BODY] == pat(*smtp_active_connections*)"
      - "[BODY] == pat(*# TYPE smtp_request_time*)"

  - name: stalwart-smtp-antispam
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP smtp_active_connections*)"
      - "[BODY] == pat(*# HELP delivery_active_connections*)"
      - "[BODY] == pat(*delivery_active_connections*)"

  - name: stalwart-delivery
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*delivery_active_connections*)"
      - "[BODY] == pat(*# HELP delivery_active_connections*)"

  - name: stalwart-imap
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP imap_active_connections*)"
      - "[BODY] == pat(*imap_active_connections*)"

  - name: stalwart-jmap-http
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*http_active_connections*)"
      - "[BODY] == pat(*http_request_time_count*)"

  - name: stalwart-store
    <<: *prometheus
    group: Stalwart Metrics
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP user_count*)"
      - "[BODY] == pat(*user_count*)"
      - "[BODY] == pat(*# HELP domain_count*)"
      - "[BODY] == pat(*domain_count*)"

  - name: stalwart-error-counters
    <<: *prometheus
    group: Stalwart Metrics
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*store_unexpected_error*)"
      - "[BODY] == pat(*smtp_concurrency_limit_exceeded*)"
      - "[BODY] == pat(*calendar_rule_expansion_error*)"
