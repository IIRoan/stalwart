storage:
  type: sqlite
  path: /data/gatus.db
  maximum-number-of-results: 100

web:
  address: 0.0.0.0
  port: ${PORT}

metrics: true

ui:
  title: "Solace Status"
  header: "Solace"
  description: "Uptime for Solace (solace.onl) and mail (mail.solace.onl)."
  dashboard-heading: "Service Health"
  dashboard-subheading: "Three-month uptime for Solace and mail infrastructure."
  logo: /solace-logo.png
  link: "https://solace.onl"
  dark-mode: false
  default-sort-by: group
  favicon:
    default: /favicon.ico
    size16x16: /favicon-16x16.png
    size32x32: /favicon-32x32.png
  buttons:
    - name: "Open Solace"
      link: "https://solace.onl"
  custom-css: |
    /* Solace theme — Gatus documented selectors (gatus.io/docs/appearance) */
    #global {
      background-color: #faf6f4 !important;
      color: #202020 !important;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .dashboard-container {
      background-color: #faf6f4 !important;
    }

    .endpoint,
    .endpoint-group {
      background-color: #fcfcfc !important;
      border: 1px solid #dacac4 !important;
    }

    .endpoint-header,
    .endpoint-group-header {
      background-color: #f5f1ef !important;
      color: #644a40 !important;
    }

    .endpoint-content,
    .endpoint-group-content {
      background-color: #fcfcfc !important;
      color: #202020 !important;
    }

    .announcement-container {
      background-color: #fcfcfc !important;
      border: 1px solid #dacac4 !important;
    }

    .announcement-header {
      background-color: #f5f1ef !important;
      color: #644a40 !important;
    }

    .announcement-content {
      background-color: #fcfcfc !important;
      color: #202020 !important;
    }

    header {
      background-color: #fcfcfc !important;
      border-bottom: 1px solid #dacac4 !important;
    }

    header h1,
    .dashboard-container h1 {
      color: #644a40 !important;
    }

    header img {
      border-radius: 9999px;
    }

    header .container,
    .dashboard-container .container {
      max-width: 80rem;
    }

    #global .text-muted-foreground {
      color: #555555 !important;
    }

    #global .text-primary {
      color: #644a40 !important;
    }

    #global .bg-primary {
      background-color: #644a40 !important;
      color: #ffffff !important;
    }

    .text-green-500,
    .text-green-400,
    .text-green-600,
    .text-green-700 {
      color: #7ccd8e !important;
    }

    .bg-green-500,
    .bg-green-600,
    .bg-green-700,
    .hover\:bg-green-700:hover {
      background-color: #7ccd8e !important;
    }

    .text-red-500,
    .text-red-600,
    .text-red-700 {
      color: #e54d2e !important;
    }

    .bg-red-500,
    .bg-red-600,
    .bg-red-700,
    .hover\:bg-red-700:hover {
      background-color: #e54d2e !important;
    }

    .dark #global,
    .dark .dashboard-container {
      background-color: #111111 !important;
      color: #eeeeee !important;
    }

    .dark .endpoint,
    .dark .endpoint-group,
    .dark .endpoint-content,
    .dark .endpoint-group-content,
    .dark .announcement-container,
    .dark .announcement-content {
      background-color: #191919 !important;
      border-color: #2e2a24 !important;
      color: #eeeeee !important;
    }

    .dark .endpoint-header,
    .dark .endpoint-group-header,
    .dark .announcement-header,
    .dark header {
      background-color: #222018 !important;
      color: #f5d9a8 !important;
      border-color: #2e2a24 !important;
    }

    .dark header h1,
    .dark .dashboard-container h1 {
      color: #f5d9a8 !important;
    }

    footer,
    #social {
      display: none !important;
    }

.endpoint-ui: &endpoint-ui
  period: 90d

# Shared Prometheus scrape target (auth injected at boot).
# Scraped via slot-manager so HAProxy never round-robins to the warming slot during cutover.
.prometheus: &prometheus
  url: https://mail.solace.onl/slot-manager/metrics/prometheus
  headers:
    Authorization: "Basic __PROMETHEUS_BASIC_AUTH__"
  client:
    timeout: 15s
  ui:
    <<: *endpoint-ui
    hide-url: true

endpoints:
  - name: website
    group: Application
    url: https://solace.onl/
    interval: 60s
    ui:
      <<: *endpoint-ui
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: api-health
    group: Application
    url: https://api.solace.onl/api/health
    interval: 60s
    ui:
      <<: *endpoint-ui
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: jmap-session
    group: Mail
    url: https://mail.solace.onl/jmap/session
    interval: 30s
    ui:
      <<: *endpoint-ui
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: slot-blue-green
    group: Mail
    url: https://mail.solace.onl/slot-manager/status
    interval: 60s
    ui:
      <<: *endpoint-ui
    headers:
      Authorization: "Bearer ${SLOT_MANAGER_TOKEN}"
    conditions:
      - "[STATUS] == 200"

  - name: stalwart-exporter
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP server_memory*)"
      - "[BODY] == pat(*# TYPE server_memory*)"

  - name: stalwart-smtp-receive
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP smtp_active_connections*)"
      - "[BODY] == pat(*smtp_active_connections*)"
      - "[BODY] == pat(*# TYPE smtp_request_time*)"

  - name: stalwart-smtp-antispam
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP smtp_active_connections*)"
      - "[BODY] == pat(*# HELP delivery_active_connections*)"
      - "[BODY] == pat(*delivery_active_connections*)"

  - name: stalwart-delivery
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*delivery_active_connections*)"
      - "[BODY] == pat(*# HELP delivery_active_connections*)"

  - name: stalwart-imap
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP imap_active_connections*)"
      - "[BODY] == pat(*imap_active_connections*)"

  - name: stalwart-jmap-http
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*http_active_connections*)"
      - "[BODY] == pat(*http_request_time_count*)"

  - name: stalwart-store
    <<: *prometheus
    group: Stalwart Metrics
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP user_count*)"
      - "[BODY] == pat(*user_count*)"
      - "[BODY] == pat(*# HELP domain_count*)"
      - "[BODY] == pat(*domain_count*)"

  - name: stalwart-error-counters
    <<: *prometheus
    group: Stalwart Metrics
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*store_unexpected_error*)"
      - "[BODY] == pat(*smtp_concurrency_limit_exceeded*)"
      - "[BODY] == pat(*calendar_rule_expansion_error*)"
