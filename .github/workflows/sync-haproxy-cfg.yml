name: Sync HAProxy config

# Install vps/haproxy.cfg on the mail VPS (gh-cert-sync sudo install + reload).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-haproxy-cfg-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Deploy haproxy.cfg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mail-vps
    if: |
      github.repository == 'IIRoan/stalwart'
      && github.event.repository.fork == false
      && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    steps:
      - name: Assert trusted ref
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "IIRoan/stalwart"
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false

      - name: Deploy HAProxy config
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_PRIVATE_KEY:?set Environment secret VPS_SSH_PRIVATE_KEY on mail-vps}"
          HOST="${VPS_SSH_HOST:-mail.solace.onl}"
          USER="${VPS_SSH_USER:-gh-cert-sync}"
          PORT="${VPS_SSH_PORT:-22}"
          echo "Deploy target: ${USER}@${HOST}:${PORT}"

          KEY="$(mktemp)"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" >"$KEY"
          chmod 600 "$KEY"

          SSH=(ssh -i "$KEY" -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes
               -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "$KEY" -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes
               -o StrictHostKeyChecking=accept-new)

          "${SCP[@]}" vps/haproxy.cfg "${USER}@${HOST}:/tmp/haproxy.cfg.new"
          "${SSH[@]}" "${USER}@${HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          sudo -n /usr/bin/install -m 644 /tmp/haproxy.cfg.new /etc/haproxy/haproxy.cfg
          sudo -n /usr/sbin/haproxy -c -f /etc/haproxy/haproxy.cfg
          sudo -n /bin/systemctl reload haproxy
          rm -f /tmp/haproxy.cfg.new
          echo "HAProxy config installed and reloaded."
          REMOTE
