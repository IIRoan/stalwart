# HAProxy on the public VPS.
# Public internet -> HAProxy (:25, :443)
#                -> blue/green frps localhost ports
#                -> outbound frp tunnel -> Railway Stalwart
#
# Install: apt install haproxy
# Place at /etc/haproxy/haproxy.cfg and run: systemctl reload haproxy
#
# Active slot is read from /etc/haproxy/stalwart-active-slot.
# Use the helper script in vps/stalwart-switch-slot.sh to switch traffic.

global
    log /dev/log local0
    maxconn 4096
    stats socket /run/haproxy/admin.sock mode 660 level admin
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 10s
    timeout client  5m
    timeout server  5m

frontend ft_smtp
    bind *:25
    default_backend bk_smtp

# TLS terminated here; plain HTTP forwarded through frp tunnel to Railway :8080
# NOTE: Proxy Protocol is NOT used here because HAProxy terminates TLS and
# forwards plain HTTP. Stalwart's HTTP listener uses X-Forwarded-For instead.
frontend ft_https
    bind *:443 ssl crt /etc/haproxy/certs/mail.solace.onl.pem
    mode http
    option http-buffer-request
    option httplog
    acl is_slot_manager path_beg /slot-manager/
    use_backend bk_slot_manager if is_slot_manager
    default_backend bk_https

# Optional: expose WebAdmin/JMAP through the VPS instead of Railway HTTP domain.
# Bind on localhost only; public WebAdmin access is via HTTPS (port 443).
frontend ft_http_admin
    bind 127.0.0.1:8080
    default_backend bk_http_admin

backend bk_smtp
    balance roundrobin
    option tcp-check
    default-server inter 1s fastinter 500ms downinter 1s fall 3 rise 1
    server railway_blue 127.0.0.1:10025 send-proxy-v2 check init-state fully-up

    server railway_green 127.0.0.1:11025 send-proxy-v2 check init-state fully-up

backend bk_https
    mode http
    balance roundrobin
    option redispatch
    option httpchk
    retries 3
    retry-on conn-failure empty-response response-timeout 503
    http-check send meth GET uri / ver HTTP/1.1 hdr Host mail.solace.onl
    http-check expect ! rstatus ^5
    default-server inter 1s fastinter 500ms downinter 1s fall 3 rise 1
    server railway_blue 127.0.0.1:10443 check init-state fully-up

    server railway_green 127.0.0.1:11443 check init-state fully-up

backend bk_http_admin
    balance roundrobin
    option tcp-check
    default-server inter 1s fastinter 500ms downinter 1s fall 3 rise 1
    server railway_blue 127.0.0.1:18080 check init-state fully-up

    server railway_green 127.0.0.1:19080 check init-state fully-up

backend bk_slot_manager
    mode http
    http-request replace-path ^/slot-manager/(.*)$ /\1
    option httpchk GET /active
    http-check expect status 200
    server slot_manager 127.0.0.1:9081 check
