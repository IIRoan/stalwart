# HAProxy public edge: TCP/HTTP to blue/green frps; install at /etc/haproxy/haproxy.cfg.
global
    log /dev/log local0
    maxconn 4096
    stats socket /run/haproxy/admin.sock mode 660 level admin
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 10s
    timeout client  5m
    timeout server  5m

frontend ft_smtp
    bind *:25
    default_backend bk_smtp

# HTTP→HTTPS redirect so browsers can see HSTS on :80.
frontend ft_http
    bind *:80
    mode http
    option httplog
    http-request redirect scheme https code 301
    http-after-response set-header Strict-Transport-Security "max-age=15552000"

# TLS terminates here; plain HTTP is forwarded to Stalwart with PROXY v2.
frontend ft_https
    bind *:443 ssl crt /etc/haproxy/certs/mail.solace.onl.pem
    mode http
    option http-buffer-request
    option httplog
    acl is_slot_manager path_beg /slot-manager/
    acl is_security_txt path /.well-known/security.txt
    acl is_admin_ui path_beg /admin
    # Operator allowlist lives on the VPS only (not in git). Deploy via sync-haproxy-cfg.
    acl is_admin_allowed src -f /etc/haproxy/admin-allow.lst
    acl is_api path_beg /api
    acl is_api_discover path_beg /api/discover
    acl is_api_auth path_beg /api/auth
    http-request return status 200 content-type "text/plain; charset=utf-8" lf-string "Contact: mailto:postmaster@solace.onl\nExpires: 2027-08-26T00:00:00.000Z\nPreferred-Languages: en\nCanonical: https://mail.solace.onl/.well-known/security.txt\n" if is_security_txt
    http-request return status 404 if is_admin_ui !is_admin_allowed
    http-request return status 404 if is_api !is_api_discover !is_api_auth
    http-after-response set-header Strict-Transport-Security "max-age=15552000"
    http-after-response set-header X-Content-Type-Options "nosniff"
    http-after-response set-header X-Frame-Options "DENY"
    http-after-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-after-response set-header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    http-after-response set-header Cross-Origin-Opener-Policy "same-origin"
    http-after-response set-header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; upgrade-insecure-requests" if { res.hdr(content-type) -m sub text/html }
    use_backend bk_slot_manager if is_slot_manager
    default_backend bk_https

# Loopback WebAdmin (SSH tunnel). Public :443 allows /admin only from is_admin_allowed.
frontend ft_http_admin
    bind 127.0.0.1:8080
    mode http
    option httplog
    default_backend bk_http_admin

frontend ft_submissions
    bind *:465
    default_backend bk_submissions

frontend ft_imaps
    bind *:993
    default_backend bk_imaps

# Only HAProxy should send PROXY v2; frpc must pass it through (no second header).
backend bk_smtp
    balance roundrobin
    option tcp-check
    default-server inter 4s fastinter 2s downinter 4s fall 3 rise 1
    server railway_blue 127.0.0.1:10025 send-proxy-v2 check check-send-proxy

    server railway_green 127.0.0.1:11025 send-proxy-v2 check check-send-proxy

backend bk_submissions
    balance roundrobin
    option tcp-check
    default-server inter 4s fastinter 2s downinter 4s fall 3 rise 1
    server railway_blue 127.0.0.1:10465 send-proxy-v2 check check-send-proxy

    server railway_green 127.0.0.1:11465 send-proxy-v2 check check-send-proxy

backend bk_imaps
    balance roundrobin
    option tcp-check
    default-server inter 4s fastinter 2s downinter 4s fall 3 rise 1
    server railway_blue 127.0.0.1:10993 send-proxy-v2 check check-send-proxy

    server railway_green 127.0.0.1:11993 send-proxy-v2 check check-send-proxy

backend bk_https
    mode http
    balance roundrobin
    option redispatch
    option httpchk
    retries 3
    retry-on conn-failure empty-response response-timeout 503
    http-check send meth GET uri /jmap/session ver HTTP/1.1 hdr Host mail.solace.onl
    http-check expect status 200
    default-server inter 4s fastinter 2s downinter 4s fall 3 rise 1
    server railway_blue 127.0.0.1:18080 send-proxy-v2 check check-send-proxy

    server railway_green 127.0.0.1:19080 send-proxy-v2 check check-send-proxy

backend bk_http_admin
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /jmap/session ver HTTP/1.1 hdr Host mail.solace.onl
    http-check expect status 200
    default-server inter 4s fastinter 2s downinter 4s fall 3 rise 1
    server railway_blue 127.0.0.1:18080 send-proxy-v2 check check-send-proxy

    server railway_green 127.0.0.1:19080 send-proxy-v2 check check-send-proxy

backend bk_slot_manager
    mode http
    http-request replace-path ^/slot-manager/(.*)$ /\1
    option httpchk GET /active
    http-check expect status 200
    server slot_manager 127.0.0.1:9081 check
