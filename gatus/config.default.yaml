storage:
  type: sqlite
  path: /data/gatus.db
  maximum-number-of-results: 100

web:
  address: 0.0.0.0
  port: ${PORT}

metrics: true

alerting:
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    title: "Solace Status"
    default-alert:
      send-on-resolved: true
      failure-threshold: 2
      success-threshold: 2
      description: "Service monitor failed"

ui:
  title: "Solace Status"
  header: "Solace"
  description: "Uptime for Solace (solace.onl) and mail (mail.solace.onl)."
  dashboard-heading: "Service Health"
  dashboard-subheading: "Three-month uptime for Solace and mail infrastructure."
  logo: /solace-logo.png
  link: "https://solace.onl"
  # Default when no cookie / OS preference; prefers-color-scheme still wins.
  dark-mode: false
  default-sort-by: group
  favicon:
    default: /favicon.ico
    size16x16: /favicon-16x16.png
    size32x32: /favicon-32x32.png
  buttons:
    - name: "Open Solace"
      link: "https://solace.onl"
  custom-css: |
    /* Solace light / dark tokens (HSL channels for Tailwind hsl(var(--*))) */
    :root {
      --background: 0 0% 97.6%;
      --foreground: 0 0% 12.5%;
      --card: 0 0% 98.8%;
      --card-foreground: 0 0% 12.5%;
      --popover: 0 0% 98.8%;
      --popover-foreground: 0 0% 12.5%;
      --primary: 16.7 22% 32.2%;
      --primary-foreground: 0 0% 100%;
      --secondary: 34.1 100% 85.5%;
      --secondary-foreground: 16.3 50.4% 22.9%;
      --muted: 0 0% 93.7%;
      --muted-foreground: 0 0% 33.3%;
      --accent: 0 0% 91%;
      --accent-foreground: 0 0% 12.5%;
      --destructive: 10.2 77.9% 53.9%;
      --destructive-foreground: 0 0% 100%;
      --border: 0 0% 82%;
      --input: 0 0% 84.7%;
      --ring: 16.7 22% 32.2%;
      --radius: 0.5rem;
    }

    :root.dark {
      --background: 0 0% 6.7%;
      --foreground: 0 0% 93.3%;
      --card: 0 0% 9.8%;
      --card-foreground: 0 0% 93.3%;
      --popover: 0 0% 9.8%;
      --popover-foreground: 0 0% 93.3%;
      --primary: 29.5 100% 88%;
      --primary-foreground: 183.2 54.3% 6.9%;
      --secondary: 28.2 17.5% 19%;
      --secondary-foreground: 29.5 100% 88%;
      --muted: 0 0% 13.3%;
      --muted-foreground: 0 0% 62%;
      --accent: 0 0% 16.5%;
      --accent-foreground: 0 0% 93.3%;
      --destructive: 10.2 77.9% 53.9%;
      --destructive-foreground: 0 0% 100%;
      --border: 46.7 10.3% 17.1%;
      --input: 0 0% 28.2%;
      --ring: 29.5 100% 88%;
    }

    body,
    #global {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
    }

    header .container,
    .dashboard-container .container {
      max-width: 80rem;
    }

    header {
      border-bottom: 1px solid hsl(var(--border));
      background: hsl(var(--card));
    }

    header img,
    header .logo {
      border-radius: 0.35rem;
    }

    .dashboard-container h1,
    .dashboard-container h2 {
      letter-spacing: -0.02em;
    }

    a {
      color: hsl(var(--primary));
    }

    a:hover {
      opacity: 0.85;
    }

    footer,
    #social {
      display: none !important;
    }

.endpoint-ui: &endpoint-ui
  period: 90d

.discord-alerts: &discord-alerts
  alerts:
    - type: discord

# Prometheus scrape via slot-manager so HAProxy never hits the warming slot.
.prometheus: &prometheus
  <<: *discord-alerts
  url: https://mail.solace.onl/slot-manager/metrics/prometheus
  headers:
    Authorization: "Basic __PROMETHEUS_BASIC_AUTH__"
  client:
    timeout: 15s
  ui:
    <<: *endpoint-ui
    hide-url: true

endpoints:
  - name: website
    <<: *discord-alerts
    group: Application
    url: https://solace.onl/
    interval: 60s
    ui:
      <<: *endpoint-ui
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: api-health
    <<: *discord-alerts
    group: Application
    url: https://api.solace.onl/api/health
    interval: 60s
    ui:
      <<: *endpoint-ui
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: jmap-session
    <<: *discord-alerts
    group: Mail
    url: https://mail.solace.onl/jmap/session
    interval: 30s
    ui:
      <<: *endpoint-ui
    client:
      timeout: 10s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 336h"

  - name: slot-blue-green
    <<: *discord-alerts
    group: Mail
    url: https://mail.solace.onl/slot-manager/status
    interval: 60s
    ui:
      <<: *endpoint-ui
    headers:
      Authorization: "Bearer ${SLOT_MANAGER_TOKEN}"
    conditions:
      - "[STATUS] == 200"

  - name: stalwart-exporter
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP server_memory*)"
      - "[BODY] == pat(*# TYPE server_memory*)"

  - name: stalwart-smtp-receive
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP smtp_active_connections*)"
      - "[BODY] == pat(*smtp_active_connections*)"
      - "[BODY] == pat(*# TYPE smtp_request_time*)"

  - name: stalwart-smtp-antispam
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP smtp_active_connections*)"
      - "[BODY] == pat(*# HELP delivery_active_connections*)"
      - "[BODY] == pat(*delivery_active_connections*)"

  - name: stalwart-delivery
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*delivery_active_connections*)"
      - "[BODY] == pat(*# HELP delivery_active_connections*)"

  - name: stalwart-imap
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP imap_active_connections*)"
      - "[BODY] == pat(*imap_active_connections*)"

  - name: stalwart-jmap-http
    <<: *prometheus
    group: Stalwart Metrics
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*http_active_connections*)"
      - "[BODY] == pat(*http_request_time_count*)"

  - name: stalwart-store
    <<: *prometheus
    group: Stalwart Metrics
    interval: 120s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*# HELP user_count*)"
      - "[BODY] == pat(*user_count*)"
      - "[BODY] == pat(*# HELP domain_count*)"
      - "[BODY] == pat(*domain_count*)"

  - name: stalwart-error-counters
    <<: *prometheus
    group: Stalwart Metrics
    interval: 120s
    conditions:
      # Store I/O must be present; error counters are unhealthy only when exported (>0).
      - "[STATUS] == 200"
      - "[BODY] == pat(*store_blob_read*)"
      - "[BODY] == pat(*store_data_write*)"
      - "[BODY] != pat(*store_unexpected_error*)"
      - "[BODY] != pat(*store_s3_error*)"
      - "[BODY] != pat(*smtp_concurrency_limit_exceeded*)"
      - "[BODY] != pat(*calendar_rule_expansion_error*)"
