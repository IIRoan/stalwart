name: Inspect admin ACL
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: mail-vps
    steps:
      - name: Inspect
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY=$(mktemp); printf '%s\n' "$VPS_SSH_PRIVATE_KEY" >"$KEY"; chmod 600 "$KEY"
          ssh -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            gh-cert-sync@mail.solace.onl 'echo === allowlist ===; cat /etc/haproxy/admin-allow.lst | sed "s/./*/g"; echo; echo bytes=$(wc -c </etc/haproxy/admin-allow.lst); echo === acl lines ===; grep -n admin /etc/haproxy/haproxy.cfg | head -20'
