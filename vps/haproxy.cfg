# HAProxy on the public VPS.
# Public internet -> HAProxy (:25, :465, :587, :993, :443)
#                -> frps localhost ports (:10025, :10465, ...)
#                -> outbound frp tunnel -> Railway Stalwart
#
# Install: apt install haproxy
# Place at /etc/haproxy/haproxy.cfg and run: systemctl reload haproxy
#
# TLS is terminated on HAProxy for HTTPS; plain HTTP is forwarded through frp tunnel.
# IMAPS/SMTPS use end-to-end TLS (Stalwart handles them directly via frp).

global
    log /dev/log local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 10s
    timeout client  5m
    timeout server  5m

frontend ft_smtp
    bind *:25
    default_backend bk_smtp

frontend ft_submissions
    bind *:465
    default_backend bk_submissions

frontend ft_submission
    bind *:587
    default_backend bk_submission

frontend ft_imaps
    bind *:993
    default_backend bk_imaps

# TLS terminated here; plain HTTP forwarded through frp tunnel to Railway :8080
# NOTE: Proxy Protocol is NOT used here because HAProxy terminates TLS and
# forwards plain HTTP. Stalwart's HTTP listener uses X-Forwarded-For instead.
frontend ft_https
    bind *:443 ssl crt /etc/haproxy/certs/mail.solace.onl.pem
    mode tcp
    default_backend bk_https

# Optional: expose WebAdmin/JMAP through the VPS instead of Railway HTTP domain.
# Bind on localhost only; public WebAdmin access is via HTTPS (port 443).
frontend ft_http_admin
    bind 127.0.0.1:8080
    default_backend bk_http_admin

backend bk_smtp
    server railway 127.0.0.1:10025 send-proxy-v2

backend bk_submissions
    server railway 127.0.0.1:10465 send-proxy-v2

backend bk_submission
    server railway 127.0.0.1:10587 send-proxy-v2

backend bk_imaps
    server railway 127.0.0.1:10993 send-proxy-v2

backend bk_https
    server railway 127.0.0.1:10443

backend bk_http_admin
    server railway 127.0.0.1:18080
