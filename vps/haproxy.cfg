# HAProxy on the public VPS.
# Public internet -> HAProxy (:25, :443)
#                -> blue/green frps localhost ports
#                -> outbound frp tunnel -> Railway Stalwart
#
# Install: apt install haproxy
# Place at /etc/haproxy/haproxy.cfg and run: systemctl reload haproxy
#
# Active slot is read from /etc/haproxy/stalwart-active-slot.
# Use the helper script in vps/stalwart-switch-slot.sh to switch traffic.

global
    log /dev/log local0
    maxconn 4096
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 10s
    timeout client  5m
    timeout server  5m

frontend ft_smtp
    bind *:25
    acl active_green str(green) -f /etc/haproxy/stalwart-active-slot
    use_backend bk_smtp_green if active_green
    default_backend bk_smtp_blue

# TLS terminated here; plain HTTP forwarded through frp tunnel to Railway :8080
# NOTE: Proxy Protocol is NOT used here because HAProxy terminates TLS and
# forwards plain HTTP. Stalwart's HTTP listener uses X-Forwarded-For instead.
frontend ft_https
    bind *:443 ssl crt /etc/haproxy/certs/mail.solace.onl.pem
    mode tcp
    acl active_green str(green) -f /etc/haproxy/stalwart-active-slot
    use_backend bk_https_green if active_green
    default_backend bk_https_blue

# Optional: expose WebAdmin/JMAP through the VPS instead of Railway HTTP domain.
# Bind on localhost only; public WebAdmin access is via HTTPS (port 443).
frontend ft_http_admin
    bind 127.0.0.1:8080
    acl active_green str(green) -f /etc/haproxy/stalwart-active-slot
    use_backend bk_http_admin_green if active_green
    default_backend bk_http_admin_blue

backend bk_smtp_blue
    option tcp-check
    default-server inter 2s fall 2 rise 1
    server railway_blue 127.0.0.1:10025 send-proxy-v2 check

backend bk_smtp_green
    option tcp-check
    default-server inter 2s fall 2 rise 1
    server railway_green 127.0.0.1:11025 send-proxy-v2 check

backend bk_https_blue
    option tcp-check
    default-server inter 2s fall 2 rise 1
    server railway_blue 127.0.0.1:10443 check

backend bk_https_green
    option tcp-check
    default-server inter 2s fall 2 rise 1
    server railway_green 127.0.0.1:11443 check

backend bk_http_admin_blue
    option tcp-check
    default-server inter 2s fall 2 rise 1
    server railway_blue 127.0.0.1:18080 check

backend bk_http_admin_green
    option tcp-check
    default-server inter 2s fall 2 rise 1
    server railway_green 127.0.0.1:19080 check
